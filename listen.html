<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listen - Slink Taylor</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="logo">
                <a href="index.html">Slink Taylor</a>
            </h1>
        </header>
        
        <main class="listen-content">
            <h2>Listen to my music</h2>
            
            <div class="streaming-links">
                <a href="#" class="streaming-link" data-platform="spotify">
                    <span class="platform-name">Spotify</span>
                </a>
                
                <a href="#" class="streaming-link" data-platform="apple">
                    <span class="platform-name">Apple Music</span>
                </a>
                
                <a href="#" class="streaming-link" data-platform="youtube">
                    <span class="platform-name">YouTube Music</span>
                </a>
                
                <a href="#" class="streaming-link" data-platform="soundcloud">
                    <span class="platform-name">SoundCloud</span>
                </a>
                
                <a href="#" class="streaming-link" data-platform="bandcamp">
                    <span class="platform-name">Bandcamp</span>
                </a>
            </div>
        </main>
    </div>
    
    <script src="js/main.js"></script>
</body>
</html>
